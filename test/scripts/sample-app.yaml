apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: web
          image: traefik/whoami:v1.9.0
          args:
            - "--port=80"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-baseline
spec:
  selector:
    app: my-app
  ports:
    - port: 3000
      targetPort: 80
